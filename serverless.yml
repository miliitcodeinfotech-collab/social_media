service: inout-social-backend

provider:
  name: aws
  runtime: nodejs20.x
  region: ap-south-1
  stage: ${opt:stage, 'dev'}
  environment:
    MONGODB_URI: ${env:MONGODB_URI}
    CORS_ORIGIN: ${env:CORS_ORIGIN}
    PORT: ${env:PORT}
    JWT_SECRET: ${env:JWT_SECRET}
    JWT_EXPIRY: ${env:JWT_EXPIRY}

functions:
  api:
    handler: handler.handler
    events:
      - httpApi: '*'

plugins:
  - serverless-offline

useDotenv: true
